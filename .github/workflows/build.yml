name: Build Custom Light KitKat Virtual ROM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full android-sdk-libsparse-utils brotli android-tools-fsutils

      - name: Download Google Light KitKat Base ROM
        run: |
          echo "Downloading lightweight Google KitKat Base ROM..."
          # এখানে আপনার কিটক্যাট জিপ রমের ডাইরেক্ট ডাউনলোড লিংক বসাতে হবে

      - name: Extract System Image
        run: |
          echo "Extracting system.img from base ROM..."

      - name: Inject System Apps & Custom Configurations
        run: |
          echo "Injecting pre-installed system apps..."
          mkdir -p ./rom_work/system/app/
          mkdir -p ./rom_work/system/priv-app/

      - name: Repack System Image & Build Final ROM
        run: |
          echo "Repacking System Image into final ROM..."

      - name: Upload Built ROM Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-KitKat-VANY-ROM
          path: Custom_KitKat_VANY_ROM.zip
          

name: Build KitKat Watch App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK or Environment
      run: |
        echo "Preparing build environment for Watch OS..."

    - name: Create Basic Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/watch/kitkat
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # build.gradle (App level)
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.watch.kitkat'
            compileSdk 34
            defaultConfig {
                applicationId "com.watch.kitkat"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

        # settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "KitKatWatch"
        include ':app'
        EOF

        # build.gradle (Root level)
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # gradle-wrapper.properties
        mkdir -p gradle/wrapper
        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        # AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:label="KitKat Watch"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # MainActivity.java (KitKat Watch UI Logic placeholder)
        cat << 'EOF' > app/src/main/java/com/watch/kitkat/MainActivity.java
        package com.watch.kitkat;
        import android.app.Activity;
        import android.os.Bundle;
        import android.widget.LinearLayout;
        import android.widget.TextView;
        import android.graphics.Color;
        import android.view.Gravity;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setBackgroundColor(Color.BLACK);
                layout.setGravity(Gravity.CENTER);

                TextView tv = new TextView(this);
                tv.setText("KitKat Watch OS\n[Google Bar & Side Buttons Ready]");
                tv.setTextColor(Color.WHITE);
                tv.setTextSize(18);
                tv.setGravity(Gravity.CENTER);
                layout.addView(tv);

                setContentView(layout);
            }
        }
        EOF

        chmod +x gradlew || true

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kitkat-watch-apk
        path: app/build/outputs/apk/debug/app-debug.apk

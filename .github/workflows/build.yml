name: VANY ROM System Apps Packer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-pack:
    name: Build and Inject into ROM Structure
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: "va_style_launcher", dir: "rom_source_codes/va_style_launcher" }
          - { name: "va_sky_launcher", dir: "rom_source_codes/va_sky_launcher" }
          - { name: "va_smart_keyboard", dir: "rom_source_codes/va_smart_keyboard" }
          - { name: "va_apk_installer", dir: "rom_source_codes/va_apk_installer" }
          - { name: "va_system_settings", dir: "rom_source_codes/va_system_settings" }
          - { name: "va_smart_file_manager", dir: "rom_source_codes/va_smart_file_manager" }
          - { name: "va_clock", dir: "rom_source_codes/va_clock" }
          - { name: "va_calculator", dir: "rom_source_codes/va_calculator" }
          - { name: "va_theme_app", dir: "rom_source_codes/va_theme_app" }
          - { name: "va_smart_security", dir: "rom_source_codes/va_smart_security" }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle Wrapper Permission
        run: |
          if [ -f "${{ matrix.app.dir }}/gradlew" ]; then
            chmod +x ${{ matrix.app.dir }}/gradlew
          fi

      - name: Build Release APK
        run: |
          if [ -d "${{ matrix.app.dir }}" ]; then
            cd ${{ matrix.app.dir }}
            if [ -f "./gradlew" ]; then
              ./gradlew assembleRelease --no-daemon
            else
              gradle assembleRelease --no-daemon
            fi
          fi

      - name: Inject APK into ROM System Directory
        run: |
          # রম সোর্সের সিস্টেম অ্যাপ ফোল্ডার তৈরি (যেমন: android/system/app/)
          ROM_SYSTEM_DIR="rom_output/system/app/${{ matrix.app.name }}"
          mkdir -p "$ROM_SYSTEM_DIR"
          
          # বিল্ড হওয়া APK ফাইলটি খুঁজে রম ফোল্ডারে কপি করা
          find "${{ matrix.app.dir }}" -name "*.apk" -exec cp {} "$ROM_SYSTEM_DIR/" \;
          echo "Successfully injected ${{ matrix.app.name }} into ROM system structure!"

      - name: Upload Complete ROM System Apps Package
        uses: actions/upload-artifact@v4
        with:
          name: VANY-ROM-System-Apps-Bundle
          path: rom_output/
